name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    name: Install and test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/shatalov-alex"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/shatalov-alex/homebrew-tap"
      - name: Trust the formula
        # brew install trusts a fully qualified name by itself; audit runs before it
        run: brew trust --formula shatalov-alex/tap/kcsecret
      - name: Audit
        run: brew audit --strict --online shatalov-alex/tap/kcsecret
      - name: Install
        run: brew install shatalov-alex/tap/kcsecret
      - name: Test
        run: brew test shatalov-alex/tap/kcsecret
      - name: Signature kept
        run: |
          bin="$(brew --prefix)/bin/kcsecret"
          codesign --verify --strict "$bin"
          codesign -d -r- "$bin" 2>&1 | grep -q 8b9f34eab7b2214684acee8e01413860954e5f12
          kcsecret --version
